# https://docs.smartscope.org/installation/docker-compose_details.html #
########################################################################

services:
  smartscope:
    image: ghcr.io/smartscope-org/smartscope:dev
    restart: always
    volumes:
      - ./shared/auth/:/opt/auth/:rw
      - ./shared/nginx/:/opt/shared/:rw
      - ./shared/smartscope/:/opt/config/:rw
      - ./testfiles/:/mnt/testfiles/:rw
      - ./logs/:/opt/logs/
      - ./backups/:/mnt/backups/
      - ./scratch/:/mnt/scratch/
      - ./shared/fake_scope/:/mnt/fake_scope/
    env_file:
      - smartscope.conf
      - database.conf
    depends_on:
      - db
      - cache
    networks:
      - smartscopenet
  smartscope_worker:
    extends:
      service: smartscope
    command: ["celery", "-A", "Smartscope.tasks.app", "worker", "-n", "long@%h", "-Q", "smartscope", "--loglevel=DEBUG", "--concurrency=4"]
  smartscope_ai:
    image: ghcr.io/smartscope-org/smartscopeai:dev-cpu
    restart: always
    env_file:
      - smartscope.conf
    volumes:
      - ./scratch/:/mnt/scratch/:rw
      - ./logs/ai/:/opt/logs/
      # added volume for SMARTSCOPE_AI
    networks:
      - smartscopenet
    command: ["celery", "-A", "SmartscopeAI.interfaces.celery.app", "worker", "--loglevel=DEBUG", "--pool=solo", "-Q", "smartscope_ai_cpu"]
  # smartscope_ai_rcnn:
  #   image: smartscope-ai-rcnn:dev
  #   restart: always
  #   env_file:
  #     - smartscope.conf
  #     - database.conf
  #   volumes:
  #     - ./logs/ai/:/opt/logs/
  #     - ./shared/auth/:/opt/auth/:rw
  #     - ./shared/nginx/:/opt/shared/:rw
  #     - ./shared/smartscope/:/opt/config/:rw
  #   networks:
  #     - smartscopenet
  #   command: ["celery", "-A", "Smartscope.tasks.app", "worker", "-n", "ai_rcnn@%h", "-Q", "smartscope_ai_rcnn", "--loglevel=DEBUG", "--pool=solo"]
  db:
    image: mariadb:10.5
    restart: always
    env_file:
      - database.conf
    volumes:
      - ./db/:/var/lib/mysql/
    networks:
      - smartscopenet
  cache:
    image: redis:6.2-alpine
    restart: always
    volumes:
      - ./tmp:/var/lib/redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - smartscopenet
  nginx:
    image: nginx
    restart: always
    volumes:
      - ./shared/nginx/:/opt/shared/:ro 
    networks:
      - smartscopenet
    depends_on:
      - smartscope
    command: /opt/shared/nginx-entrypoint.sh
    
networks:
  smartscopenet: {}
