{% extends "forms/formFieldsBase.html" %}

{% block extra_block %}
<div class="collapse w-100 mt-2" id="extraFormCollapse_{{id}}">
    <hr class="mx-3 my-2">
    <div id="extraFormContainer_{{id}}">
        <div class="htmx-indicator d-flex align-items-center gap-2 text-secondary">
            <span class="spinner-border spinner-border-sm" role="status"></span>
            Loading...
        </div>
    </div>
</div>
<script>
    (function() {
        const triggerEl = document.getElementById('id_{{ trigger }}');
        function handleChange() {
            const collapse = bootstrap.Collapse.getOrCreateInstance(
                document.getElementById('extraFormCollapse_{{id}}')
            );
            if (this.checked) {
                collapse.show();
                htmx.ajax('GET', '{{ url }}', {
                    target: '#extraFormContainer_{{id}}',
                    swap: 'innerHTML',
                    {% if values %}values: {{values|safe}}{% endif %}
                });
            } else {
                collapse.hide();
                document.getElementById('extraFormContainer_{{id}}').innerHTML = '';
                document.getElementById('id_{{ trigger }}_id').value = '';
            }
        }

        if (triggerEl) {
            if (triggerEl.checked) {
                // already checked on load — fire immediately with values
                handleChange.call(triggerEl);
            }
            // always listen for user input
            triggerEl.addEventListener('change', handleChange);
        }
    })();
</script>
{% endblock extra_block %}
