{% include "tags/tags_list_dropdown.html" with tags=tags post_url='addProjectTag' %}
<div id="projectsTags" class="mb-1">
    {% include "tags/tags_list.html" with tags=applied_project_tags %}
</div> 
  
<form hx-post="{% url 'createProjectTag' grid_id=grid_id %}"
    hx-target="#projectTagChoices" hx-swap="innerHTML" class="d-flex gap-1 mt-1">
    <input type="text" name="tag" class="form-control form-control-sm" placeholder="New project tag" required>
    {% if user_groups|length > 1 %}
    <select name="group" class="form-control form-control-sm">
        {% for g in user_groups %}<option value="{{ g.name }}">{{ g.name }}</option>{% endfor %}
    </select>
    {% else %}
    <input type="hidden" name="group" value="{{ user_groups.0.name }}">
    {% endif %}
    <button type="submit" class="btn btn-sm btn-outline-primary">Create</button>
</form>
  
<form hx-post="{% url 'deleteProjectTag' grid_id=grid_id %}"
    hx-target="#projectTagChoices" hx-swap="innerHTML" 
    hx-confirm="Delete this project tag for the whole group?" class="d-flex gap-1 mt-1">
    <select name="pk" class="form-control form-control-sm">
        <option value="" selected disabled hidden>Delete a tag…</option>
        {% for tag in tags %}<option value="{{ tag.pk }}">{{ tag.name }}</option>{% endfor %}
    </select>
    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
</form>
