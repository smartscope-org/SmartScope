{% extends "base.html" %}
{% load static %}
{% block title %}Smartscope Browser{% endblock %}
{% block content %}
    <div id="sideNav" class="d-flex flex-column p-0 justify-content-between">
        <ul class="list-group px-0">
            <li class="list-group-item p-1" data-bs-toggle="tooltip" title="Toggle nagivation menu">
                <button id="sidebarCollapse"
                    class="btn btn-sm btn-outline-light"
                    data-bs-toggle="collapse" data-bs-target="#sidebarNav" aria-expanded="true">
                    <i class="bi bi-list-nested" ></i>
                </button>
            </li>
            <li class="list-group-item p-1" data-bs-toggle="tooltip" title="View microscope(s) status and current sessions">
                <button id="microscopeActivity"
                    class="btn btn-sm btn-outline-light"
                    hx-get="{% url 'microscopeStatus' %}"
                    hx-target="#main">
                    <i class="bi bi-activity"></i>
                </button>
            </li>
            <li class="list-group-item p-1" data-bs-toggle="tooltip" title="View all sesssions">
                <button id="sessionHistory"
                    class="btn btn-sm btn-outline-light"
                    style="width: 32px; height: 32px; padding: 0; font-weight: 600; font-size: 14px;"
                    hx-get="{% url 'sessionHistory' %}"
                    hx-target="#main">
                    <span style="font-size: 16px; font-weight: 200;">S</span>
                </button>
            </li>
        </ul>
        <ul class="list-group px-0">
            <li class="list-group-item p-1" data-bs-toggle="tooltip" title="logout">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button id="logout" type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-box-arrow-left"></i>
                    </button>
                </form>
            </li>
        </ul>
    </div>
    <div class='p-0 d-flex flex-row w-100'>
        <div id="sidebar-container" style="width: 200px; min-width: 100px; max-width: 500px;">

            <div class="sidebar sidebar-collapse sidebar-expand-md collapse collapse-horizontal show" id="sidebarNav">
                <ul class="list-group sticky-top sticky-offset">
                    <div class="sidebar-section">
                        <li id="groups"
                            class="list-group-item sidebar-separator-title text-muted d-flex align-items-center menu-collapsed">
                            GROUPS
                        </li>
                        <div class="px-2 py-1 position-relative">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none;">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" 
                                class="form-control form-control-sm sidebar-search" 
                                placeholder="Search groups..."
                                data-target="sidebarGroups"
                                style="background: transparent; border-color: #aaa; padding-left: 1.6rem; box-shadow: none; color: #eae8e8;">
                        </div>

                        <div id="sidebarGroups" style='max-height: 25vh; overflow: auto;'>
                        </div>
                    </div>
                    <div class="section-resizer"></div>

                    <div class="sidebar-section">
                        <li id="sessions"
                            class="list-group-item sidebar-separator-title text-muted d-flex align-items-center menu-collapsed justify-content-between">
                            SESSIONS
                            <div class="d-flex align-items-center gap-2">
                                <label for="filterOwnSessions" class="text-muted mb-0" style="font-size: 0.75rem;">My sessions</label>
                                <input type="checkbox" id="filterOwnSessions" class="form-check-input mt-0"
                                    data-bs-toggle="tooltip" data-bs-placement="right" title="Filter my sessions">
                            </div>
                        </li>
                        <div class="px-2 py-1 position-relative">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none;">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" 
                                class="form-control form-control-sm sidebar-search" 
                                placeholder="Search sessions..."
                                data-target="sidebarSessions"
                                style="background: transparent; border-color: #aaa; padding-left: 1.6rem; box-shadow: none; color: #eae8e8;">
                        </div>
                        <div id="sidebarSessions" style='max-height: 25vh; overflow: auto;'>
                        </div>
                    </div>
                    <div class="section-resizer"></div>

                    <div class="sidebar-section">
                        <li id="grids"
                            class="list-group-item sidebar-separator-title text-muted d-flex align-items-center menu-collapsed">
                            GRIDS
                        </li>
                        <div id='sidebarGrids' style='max-height: 25vh; overflow: auto;'>
                        </div>
                    </div>
                </ul>
            </div>
        </div>
        <div id="sidebar-resizer" 
            style="width: 4px; cursor: col-resize; background: #444; flex-shrink: 0;"></div>
        <div id='main' class="d-flex flex-column" 
            style="flex: 1; background-color: #f5f5f5; overflow-y: scroll;"></div>
    </div>
    
{% endblock content %}

{% block script %}
<script src="{% static 'browser.js' %}"></script>
{% endblock script %}
