{% extends "base.html" %}
{% load static %}
{% block title %}Smartscope Browser{% endblock %}
{% block content %}
    <div class='p-0 d-flex flex-row w-100'>
        <div id="sidebar-container" style="width: 200px; min-width: 100px; max-width: 500px;">

            <div class="sidebar sidebar-collapse sidebar-expand-md collapse collapse-horizontal show" id="sidebarNav">
                <ul class="list-group sticky-top sticky-offset">
                    <div class="sidebar-section">
                        <li id="groups"
                            class="list-group-item sidebar-separator-title text-muted d-flex align-items-center menu-collapsed">
                            GROUPS
                        </li>
                        <div class="px-2 py-1 position-relative">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none;">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" 
                                class="form-control form-control-sm sidebar-search" 
                                placeholder="Search groups..."
                                data-target="sidebarGroups"
                                style="background: transparent; border-color: #aaa; padding-left: 1.6rem; box-shadow: none; color: #eae8e8;">
                        </div>

                        <div id="sidebarGroups" class="custom-scroll">
                        </div>
                    </div>
                    <div class="section-resizer"></div>

                    <div class="sidebar-section">
                        <li id="sessions"
                            class="list-group-item sidebar-separator-title text-muted d-flex align-items-center menu-collapsed justify-content-between">
                            SESSIONS
                            <div class="d-flex align-items-center gap-2">
                                <label for="filterOwnSessions" class="text-muted mb-0" style="font-size: 0.75rem;">My sessions</label>
                                <input type="checkbox" id="filterOwnSessions" class="form-check-input mt-0"
                                    data-bs-toggle="tooltip" data-bs-placement="right" title="Filter my sessions">
                            </div>
                        </li>
                        <div class="px-2 py-1 position-relative">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none;">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" 
                                class="form-control form-control-sm sidebar-search" 
                                placeholder="Search sessions..."
                                data-target="sidebarSessions"
                                style="background: transparent; border-color: #aaa; padding-left: 1.6rem; box-shadow: none; color: #eae8e8;">
                        </div>
                        <div id="sidebarSessions" class="custom-scroll">
                        </div>
                    </div>
                    <div class="section-resizer"></div>

                    <div class="sidebar-section">
                        <li id="grids"
                            class="list-group-item sidebar-separator-title text-muted d-flex align-items-center menu-collapsed">
                            GRIDS
                        </li>
                        <div id='sidebarGrids' class="custom-scroll">
                        </div>
                    </div>
                </ul>
            </div>
        </div>
        <div id="sidebar-resizer" 
            style="width: 4px; cursor: col-resize; background: #444; flex-shrink: 0;">
        </div>
        <div id='main' class="d-flex flex-column p-0" 
            style="flex: 1; min-width: 0; overflow: hidden; background-color: #f5f5f5;">
            {% if initial_partial %}
                {% include initial_partial %}
            {% endif %}
        </div>
    </div>
    
{% endblock content %}

{% block script %}
<script src="{% static 'browser.js' %}"></script>
{% endblock script %}
