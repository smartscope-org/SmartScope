{% load rest_framework %}

{% for item in items %}
<a class="bg-dark list-group-item list-group-item-action" id="{{item.pk}}"
    onclick={{jsfunction}}("{{field}}","{{item.pk}}") href="#">
    <div class="d-flex w-100 justify-content-start align-items-center {{item.extraCSS}} style="padding: 4px 8px;">
        <span class="menu-collapsed">{{ item }}</span>
    </div>
</a>
{% endfor %}
