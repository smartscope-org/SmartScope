name: Junk Finder
method: send_find_holes_from_square
module: Smartscope.tasks.base_tasks
kwargs: 
  imgsz: 1280
  conf_thres: 0.3
  iou_thres: 0.1
  device: '0'
  agnostic: True
  max_det: 10
  weights_circle: junk_detection/best.pt
targetClass:
  - Finder
description: |
  Junk finder that uses the YOLO architecture to identify the junk.
  Has a built-in classifier to sort out the dark contamination spots that are often labeled as junk on carbon mesh grids.
classes:
  "0":
    label_training: "0"
    value: 1
    name: Contamination
    color: LightGrey
  "1":
    label_training: "1"
    value: 1
    name: Crack
    color: LightGrey

