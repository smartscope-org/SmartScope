    - createHoleRef
    - alignToHoleRef
    - zeroImageShift
    - mediumMagHole
    - rollDefocus
    - autoFocus
    - waitDrift
    - setAFISimageShift
  targets:
    finders:
      - Medium Mag AI hole finder
highMag:
  steps:
    - highMag
